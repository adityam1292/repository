<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Ajay Dhandre. Works 2004–2025, résumé, texts and contact.">
<title>Ajay Dhandre</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<!--CONTENT-->
<div class="wrap">
  <header class="head">
    <a class="name" href="#home" data-artist></a>
    <nav class="menu" aria-label="Main">
      <a href="#works">Works</a>
      <a href="#about">About</a>
      <a href="#texts">Texts</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main>
    <section class="view" id="v-home" aria-label="Installation views">
      <div class="home" id="home-list"></div>
    </section>

    <section class="view" id="v-works" aria-label="Works" hidden>
      <div class="years" id="years" role="group" aria-label="Jump to a year"></div>
      <div id="chapters"></div>
    </section>

    <section class="view" id="v-about" aria-label="About" hidden>
      <div class="about">
        <div class="bio" id="bio"></div>
        <div class="resume" id="resume"></div>
      </div>
    </section>

    <section class="view" id="v-texts" aria-label="Texts" hidden>
      <div class="texts">
        <div>
          <h2 id="st-title"></h2>
          <div class="body" id="st-body"></div>
          <p class="by" id="st-by"></p>
        </div>
        <div>
          <h2>Texts on the work</h2>
          <ul id="texts-list"></ul>
        </div>
      </div>
    </section>

    <section class="view" id="v-contact" aria-label="Contact" hidden>
      <div class="contact">
        <div class="lines">
          <p><a class="email link" id="c-email"></a></p>
          <p><a class="link" id="c-news">Newsletter</a></p>
          <p class="gap" id="c-loc"></p>
        </div>
        <img id="c-img" alt="Ajay Dhandre in front of one of his drawings" loading="lazy">
      </div>
    </section>
  </main>
</div>

<dialog class="lb" id="lb" aria-label="Artwork viewer">
  <div class="lb-inner">
    <div class="lb-bar">
      <span id="lb-chapter"></span>
      <button class="link" type="button" id="lb-close">Close</button>
    </div>
    <div class="lb-stage"><img id="lb-img" alt=""></div>
    <div class="lb-cap">
      <p class="meta" id="lb-meta"></p>
      <p class="step"><button type="button" class="link" id="lb-prev">Previous</button><span id="lb-count"></span><button type="button" class="link" id="lb-next">Next</button></p>
    </div>
  </div>
</dialog>
<!--/CONTENT-->
<script src="data/site.js"></script>
<script src="data/works.js"></script>
<script src="js/app.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Ajay Dhandre. Selected works, résumé, texts and contact.">
<title>Ajay Dhandre</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<!--CONTENT-->
<div class="wrap">
  <header class="head">
    <a class="name" href="#home" data-artist></a>
    <nav class="menu" aria-label="Main">
      <a href="#works">Selected Works</a>
      <a href="#about">About</a>
      <a href="#texts">Texts</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main>
    <section class="view" id="v-home" aria-label="Installation views">
      <div class="home" id="home-list"></div>
    </section>

    <section class="view" id="v-works" aria-label="Selected works" hidden>
      <div class="years" id="years" role="group" aria-label="Years"></div>
      <div class="stage">
        <img id="work-img" alt="">
        <button class="hit prev" type="button" id="hit-prev" aria-label="Previous work"></button>
        <button class="hit next" type="button" id="hit-next" aria-label="Next work"></button>
      </div>
      <div class="cap">
        <p class="meta" id="work-meta"></p>
        <p class="step"><button type="button" class="link" id="btn-prev">Previous</button><span id="work-count"></span><button type="button" class="link" id="btn-next">Next</button></p>
      </div>
      <div class="thumbs" id="thumbs" aria-label="All selected works"></div>
    </section>

    <section class="view" id="v-about" aria-label="About" hidden>
      <div class="about">
        <div class="bio" id="bio"></div>
        <div class="resume" id="resume"></div>
      </div>
    </section>

    <section class="view" id="v-texts" aria-label="Texts" hidden>
      <div class="texts">
        <div>
          <h2 id="st-title"></h2>
          <div class="body" id="st-body"></div>
          <p class="by" id="st-by"></p>
        </div>
        <div>
          <h2>Texts on the work</h2>
          <ul id="texts-list"></ul>
        </div>
      </div>
    </section>

    <section class="view" id="v-contact" aria-label="Contact" hidden>
      <div class="contact">
        <div class="lines">
          <p><a class="email link" id="c-email"></a></p>
          <p><a class="link" id="c-news">Newsletter</a></p>
          <p class="gap" id="c-loc"></p>
        </div>
        <img id="c-img" alt="Ajay Dhandre in front of one of his drawings" loading="lazy">
      </div>
    </section>
  </main>
</div>
<!--/CONTENT-->
<script src="data/site.js"></script>
<script src="data/works.js"></script>
<script src="js/app.js"></script>
</body>
</html>
